[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
hex_underscore = "remove"
single_line_statement_blocks = "multi"
override_spacing = false
wrap_comments = false
contract_new_lines = false
sort_imports = true
ignore = []
